name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy \
            --target x86_64-unknown-linux-gnu
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Merge gate
        run: scripts/gate.sh

  package:
    name: package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Package listing and publish dry-run
        run: scripts/package-check.sh

  capabilities:
    name: capabilities
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Report runner capabilities
        run: scripts/doctor-summary.sh >> "$GITHUB_STEP_SUMMARY"
