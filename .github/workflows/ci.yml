name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # package and capabilities stay on the flat-layout pin. The gate job matrix
  # covers rustc 1.97.1 (flat) and 1.100.0 (unit-dir).
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  gate:
    name: gate (${{ matrix.toolchain }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.97.1", "1.100.0"]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal \
            --component rustfmt --component clippy \
            --target x86_64-unknown-linux-gnu
          rustup default "${{ matrix.toolchain }}"
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: gate-${{ matrix.toolchain }}
      - name: Merge gate
        run: scripts/gate.sh

  package:
    name: package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Package listing and publish dry-run
        run: scripts/package-check.sh

  capabilities:
    name: capabilities
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Report runner capabilities
        run: scripts/doctor-summary.sh >> "$GITHUB_STEP_SUMMARY"

  gate-latest-stable:
    # Not required: shows early when a new stable Cargo changes what hive reads.
    name: gate (latest stable, non-blocking)
    runs-on: macos-15
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy \
            --target x86_64-unknown-linux-gnu
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Merge gate
        run: scripts/gate.sh
