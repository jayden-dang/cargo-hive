[package]
name = "cargo-hive"
version = "0.1.0"
edition = "2021"
description = "Cargo build artifacts across agent worktrees on macOS, with measured receipts"
license = "MIT OR Apache-2.0"
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "cargo_hive"
path = "src/lib.rs"

[[bin]]
name = "cargo-hive"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
applesauce = "0.8.10"
objc2-local-authentication = "0.3.2"

[profile.release]
panic = "unwind"
