[package]
name = "cargo-hive"
version = "0.1.0"
edition = "2021"
description = "Reclaim and reuse Rust build artifacts across Git worktrees on macOS: safe GC for target/ dirs, dependency seeding for new worktrees, measured receipts. Built for parallel coding agents."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jayden-dang/cargo-hive"
include = ["/src/**/*", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]
name = "cargo_hive"
path = "src/lib.rs"

[[bin]]
name = "cargo-hive"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
applesauce = "0.8.10"

[profile.release]
panic = "unwind"
